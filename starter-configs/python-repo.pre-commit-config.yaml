# ===========================================================================
# Pre-commit Configuration for Python Repositories
# ===========================================================================
# This configuration follows cloud.gov pre-commit standardization.
# Each category has ONE default tool enabled; alternatives are commented.
#
# Paired `.caulking-profiles` (for `caulking.sh bootstrap --repo .`):
#   baseline
#   shell
#   python
#
# Categories:
#   - HYGIENE: Generic file quality (all repos)
#   - LINTING: Python code quality and formatting
#   - SAST: Security static analysis
#   - SCA: Dependency vulnerability scanning
#
# Setup (cloud.gov staff):
#   1. Install caulking first: https://github.com/cloud-gov/caulking
#   2. Create `.caulking-profiles` and run `caulking.sh bootstrap --repo .`
#   3. Copy this file to your repo root as .pre-commit-config.yaml
#   Note: Do NOT run `pre-commit install` — caulking handles hook execution.
#
# References:
#   - ADR-0002: Supply chain security assessment
#   - ADR-0004: Language security tool selection
# ===========================================================================

repos:
  # Canonical consolidated hook provider endpoint.
  # Legacy compatibility endpoint (frozen until the first consolidated caulking tag
  # is published): https://github.com/cloud-gov/pre-commit-templates (rev: v0.6.0)
  - repo: https://github.com/cloud-gov/caulking
    rev: v3.4.0  # Pin to specific version
    hooks:
      # =========================================================================
      # HYGIENE: Generic file quality checks
      # Satisfies: NIST SA-15 (Development Process), SSDF PO.3
      # =========================================================================
      # DEFAULT: All hygiene hooks — required for all repositories
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # Isolated self-contained syntax checks (legacy `check-yaml` / `check-json`
      # remain supported if ambient `python3` + `PyYAML` is preferred):
      - id: check-yaml-selfcontained
      - id: check-json-selfcontained

      # =========================================================================
      # LINTING: Python code quality and formatting
      # Satisfies: NIST SA-11 (Developer Testing), SSDF PW.7
      # =========================================================================
      # DEFAULT: ruff — Fast linter+formatter replacing flake8+black+isort
      - id: ruff-check
      - id: ruff-format
      #
      # ALTERNATIVE: ruff-format-check (check-only mode without modifying files)
      # - id: ruff-format-check
      #
      # OPTIONAL: mypy — Static type checking (use with ruff)
      - id: mypy
      #
      # ALTERNATIVE: pyright — Fast static type checker for Python (Microsoft, MIT;
      # built-in caulking hook installed by `python` profile via Homebrew)
      # - id: pyright
      #
      # ALTERNATIVE: pylint (category: LINTING)
      # More verbose, configurable linting
      # Install separately: pip install pylint
      #
      # ALTERNATIVE: black + isort (category: LINTING)
      # Traditional formatter combo, replaced by ruff
      # Install separately: pip install black isort

      # =========================================================================
      # SAST: Security static analysis
      # Satisfies: NIST SA-11(1) (Static Analysis), SSDF PW.7, RA-5
      # =========================================================================
      # DEFAULT: bandit — Python security linter with CWE mapping (PyCQA)
      - id: bandit
      #
      # ALTERNATIVE: semgrep with Python rules (category: SAST)
      # Cross-file dataflow analysis, broader but heavier
      # - id: semgrep
      #   args: ["--config", "p/python"]

      # =========================================================================
      # SCA: Dependency vulnerability scanning
      # Satisfies: NIST RA-5 (Vulnerability Scanning), SSDF PW.4, RV.1
      # =========================================================================
      # DEFAULT: pip-audit — Official PyPA vulnerability scanner
      - id: pip-audit
      #
      # ALTERNATIVE: osv-scanner (category: SCA)
      # Universal scanner, also scans requirements.txt
      # - id: osv-scanner-lockfile
      #
      # NOT RECOMMENDED: safety (category: SCA)
      # Commercial database dependency, limited free tier

      # =========================================================================
      # Shell scripts (if present in repo)
      # =========================================================================
      - id: shellcheck

      # =========================================================================
      # GSA compliance
      # =========================================================================
      - id: check-gsa-email

  # ===========================================================================
  # Additional community hooks (optional)
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast          # Validates Python syntax
      - id: debug-statements   # Checks for debugger imports
