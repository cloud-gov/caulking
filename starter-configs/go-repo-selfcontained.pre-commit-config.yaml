# ===========================================================================
# Pre-commit Configuration for Go Repositories — SELF-CONTAINED (Linux / CI)
# ===========================================================================
# Use this variant when you DON'T have the Go/shell tools pre-installed on PATH
# — i.e. a Linux workstation, a CI runner, or a container/devcontainer. Every
# hook here self-installs its tool via pre-commit's language machinery, so a
# clean `pre-commit install && pre-commit run --all-files` works with nothing
# pre-installed but git + pre-commit (+ a network connection on first run).
#
# Setup (cloud.gov staff):
#   1. Install caulking first: https://github.com/cloud-gov/caulking
#   2. Copy this file to your repo root as .pre-commit-config.yaml
#   3. Run `caulking.sh bootstrap --repo .` and `caulking.sh doctor --repo .`
#      (Caulking reads .pre-commit-config.yaml directly and installs/verifies
#      only the Homebrew tools required by the hooks enabled in this file.)
#   Note: Do NOT run `pre-commit install` — caulking handles hook execution.
#
# Prefer starter-configs/go-repo.pre-commit-config.yaml instead if you are on a
# caulking macOS workstation with the Go profile tools already installed.
#
# REQUIREMENTS
#   - pre-commit >= 3.0.0 (it bootstraps the Go toolchain for language: golang).
#   - Network access on FIRST run: pre-commit compiles/downloads each tool once,
#     then caches it. Fully offline/air-gapped? Pre-warm the pre-commit cache, or
#     use the `system` example + a preinstalled toolchain image.
#   - govulncheck ALSO needs network at RUN time: it fetches the vuln database
#     from https://vuln.go.dev on every run. Behind a TLS-inspection proxy
#     (e.g. Zscaler) the container must trust the corporate root CA, or point
#     govulncheck at a mirror with `-db <url>`; otherwise it fails with an x509
#     "certificate signed by unknown authority" error. (The other Go hooks only
#     need network at install time.)
#   - Secrets detection note: Caulking runs gitleaks globally on cloud.gov
#     workstations. WARNING: Do NOT set `SKIP=gitleaks` on a caulking workstation,
#     because `SKIP=gitleaks` bypasses caulking's global gitleaks scan! Instead,
#     keep the upstream gitleaks hook below for CI-only or non-caulking
#     environments, or omit it from repos developed exclusively on caulking
#     workstations.
#
# References: ADR-0004 (supply chain), ADR-0006 (Go tools), ADR-0008 (self-contained
# variants + repo-root go.mod), ADR-0009 (gitleaks via upstream hook), issue #36.
# ===========================================================================

minimum_pre_commit_version: "3.0.0"

repos:
  # Canonical consolidated hook provider endpoint.
  # Legacy compatibility endpoint (frozen until the first consolidated caulking tag
  # is published): https://github.com/cloud-gov/pre-commit-templates (rev: v0.6.0)
  - repo: https://github.com/cloud-gov/caulking
    rev: v3.4.0  # Pin to a released tag that includes the -selfcontained hooks
    hooks:
      # --- HYGIENE (all repos) ---
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # Isolated self-contained syntax checks (legacy `check-yaml` / `check-json`
      # remain supported if ambient `python3` + `PyYAML` is preferred):
      - id: check-yaml-selfcontained
      - id: check-json-selfcontained

      # --- Go: format / vet / SAST / SCA — all self-installing ---
      - id: gofmt-selfcontained
      - id: go-vet-selfcontained
      - id: gosec-selfcontained
      - id: govulncheck-selfcontained

      # --- GSA compliance ---
      - id: check-gsa-email

  # Secrets detection for CI / containers / non-caulking environments — gitleaks'
  # OWN upstream hook (a real Go module that self-installs via language: golang).
  # Caulking ships no repo-level gitleaks hook of its own (ADR-0009) because
  # caulking workstations already scan globally. Do NOT set `SKIP=gitleaks` on a
  # caulking workstation (that bypasses caulking's global gitleaks scan); instead,
  # use this upstream hook only in CI or non-caulking environments.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # golangci-lint: use its OFFICIAL hook repo (language: golang, self-installs).
  # This template does not re-wrap it; point straight at upstream and pin the rev.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-full  # runs the whole module (good for CI)

  # shellcheck: shellcheck-py bundles a prebuilt binary (language: python) — no
  # Docker daemon and no PATH shellcheck required.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # shfmt: scop/pre-commit-shfmt `shfmt-src` builds from source (language: golang)
  # so it self-installs like the other Go tools. (Community-maintained wrapper.)
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt-src
