- id: terraform-fmt
  name: Terraform format
  description: Formats Terraform files (HashiCorp Terraform)
  entry: terraform fmt -recursive
  language: system
  files: \.tf$
  pass_filenames: false
  stages: [pre-commit]

- id: terraform-validate
  name: Terraform validate
  description: Validates Terraform configuration (HashiCorp Terraform)
  entry: terraform validate
  language: system
  files: \.tf$
  pass_filenames: false
  stages: [pre-commit]

# --- OpenTofu (Linux Foundation - MPL-2.0 license, recommended) ---

- id: tofu-fmt
  name: OpenTofu format
  description: Formats Terraform files (OpenTofu - recommended)
  entry: tofu fmt -recursive
  language: system
  files: \.tf$
  pass_filenames: false
  stages: [pre-commit]

- id: tofu-validate
  name: OpenTofu validate
  description: Validates Terraform configuration (OpenTofu - recommended)
  entry: tofu validate
  language: system
  files: \.tf$
  pass_filenames: false
  stages: [pre-commit]

# --- TFLint (works with both Terraform and OpenTofu) ---

- id: tflint
  name: TFLint
  description: Terraform/OpenTofu linter
  entry: tflint
  language: system
  files: \.tf$
  pass_filenames: false
  stages: [pre-commit]

# =============================================================================
# CONTAINER HOOKS
# =============================================================================

- id: hadolint
  name: Hadolint
  description: Dockerfile linter
  entry: hadolint
  language: system
  types: [dockerfile]
  stages: [pre-commit]

# =============================================================================
# CLOUD.GOV COMPLIANCE HOOKS
# =============================================================================

- id: check-gsa-email
  name: Check GSA email
  description: Ensures commits use @gsa.gov email addresses
  entry: scripts/check-gsa-email.sh
  language: script
  stages: [commit-msg]
  always_run: true
  pass_filenames: false

# =============================================================================
# SECURITY SCANNING HOOKS
# See docs/adr/ADR-0002-supply-chain-security.md for tool assessments
# =============================================================================

# --- Secrets detection: NOT a hook here (see ADR-0005, superseded by ADR-0007) ---
# This template intentionally ships NO gitleaks hook:
#   * On caulking workstations, caulking already runs gitleaks globally — a hook
#     here would double-scan.
#   * In CI / containers / devcontainers, consumers use gitleaks' OWN upstream
#     pre-commit hook (github.com/gitleaks/gitleaks — a real Go module that
#     self-installs), pinned by rev. See starter-configs/go-repo-selfcontained.pre-commit-config.yaml.
#   * WARNING: Do NOT set `SKIP=gitleaks` globally on a caulking workstation —
#     `SKIP=gitleaks` bypasses caulking's global gitleaks scan! Instead, keep
#     upstream gitleaks hooks for CI-only or non-caulking environments.
# A cloud-gov-branded caulking-aware wrapper was tried (ADR-0005) but was removed:
# a language: golang hook resolves its `entry` against the CONSUMER repo, so a
# repo-relative wrapper script cannot be found — it never worked in CI. ADR-0007
# records the Option-C decision.

# --- Universal SCA (Software Composition Analysis) ---

- id: osv-scanner
  name: OSV Scanner
  description: Scans for vulnerable dependencies using Google OSV database
  entry: osv-scanner scan source --recursive --format=table .
  language: system
  pass_filenames: false
  stages: [pre-commit]

- id: osv-scanner-lockfile
  name: OSV Scanner (lockfiles)
  description: Fast scan of lockfiles for known vulnerabilities
  entry: osv-scanner scan --lockfile
  language: system
  files: (package-lock\.json|yarn\.lock|pnpm-lock\.yaml|Gemfile\.lock|Cargo\.lock|go\.sum|requirements\.txt|poetry\.lock|pdm\.lock)$
  stages: [pre-commit]

# --- Universal SBOM Generation ---

- id: syft
  name: Syft SBOM generator
  description: Generates CycloneDX SBOM from project (Anchore)
  entry: syft . -o cyclonedx-json=sbom.cdx.json
  language: system
  pass_filenames: false
  stages: [manual]

# --- Multi-language SAST ---

- id: semgrep
  name: Semgrep SAST
  description: Multi-language static analysis security testing
  entry: semgrep scan --config=auto --error --metrics=off
  language: system
  types: [file]
  pass_filenames: false
  stages: [pre-commit]

- id: semgrep-ci
  name: Semgrep CI (with SARIF output)
  description: Semgrep for CI with SARIF output for security dashboards
  entry: semgrep scan --config=auto --error --metrics=off --sarif --output=semgrep.sarif
  language: system
  types: [file]
  pass_filenames: false
  stages: [manual]

# --- Container/SBOM Scanning ---

- id: grype
  name: Grype container scan
  description: Scans container images for vulnerabilities (Anchore)
  entry: grype dir:. --fail-on high
  language: system
  pass_filenames: false
  stages: [manual]

- id: grype-sbom
  name: Grype SBOM scan
  description: Scans SBOM files for vulnerabilities
  entry: grype
  language: system
  files: (sbom|bom)\.(json|xml|spdx)$
  stages: [manual]

# =============================================================================
# GO SECURITY HOOKS
# See docs/adr/ADR-0004-language-security-tools.md for selection rationale
# =============================================================================

- id: govulncheck
  name: Go vulnerability check
  description: Official Go vulnerability scanner (Go Team, BSD-3-Clause)
  entry: govulncheck ./...
  language: system
  files: \.go$
  pass_filenames: false
  stages: [pre-commit]

- id: gosec
  name: Go security checker
  description: Security-focused static analysis for Go (securego, Apache-2.0)
  entry: gosec ./...
  language: system
  files: \.go$
  pass_filenames: false
  stages: [pre-commit]

# =============================================================================
# PYTHON SECURITY HOOKS
# See docs/adr/ADR-0004-language-security-tools.md for selection rationale
# =============================================================================

- id: pip-audit
  name: pip-audit
  description: Scans Python dependencies for vulnerabilities (PyPA, Apache-2.0)
  entry: pip-audit
  language: system
  files: (requirements.*\.txt|pyproject\.toml|setup\.py)$
  pass_filenames: false
  stages: [pre-commit]

- id: bandit
  name: Bandit security linter
  description: Security-focused static analysis for Python (PyCQA, Apache-2.0)
  entry: bandit -r . -x .venv,venv,node_modules,.git,build,dist
  language: system
  types: [python]
  pass_filenames: false
  stages: [pre-commit]

# =============================================================================
# JAVASCRIPT/NODE.JS SECURITY HOOKS
# See docs/adr/ADR-0004-language-security-tools.md for selection rationale
# =============================================================================

- id: npm-audit
  name: npm audit
  description: Scans npm dependencies for vulnerabilities (npm/Microsoft)
  entry: npm audit --audit-level=moderate
  language: system
  files: ^package-lock\.json$
  pass_filenames: false
  stages: [pre-commit]

- id: yarn-audit
  name: yarn audit
  description: Scans yarn dependencies for vulnerabilities
  entry: yarn audit --level moderate
  language: system
  files: ^yarn\.lock$
  pass_filenames: false
  stages: [pre-commit]

- id: pnpm-audit
  name: pnpm audit
  description: Scans pnpm dependencies for vulnerabilities
  entry: pnpm audit --audit-level moderate
  language: system
  files: ^pnpm-lock\.yaml$
  pass_filenames: false
  stages: [pre-commit]

- id: retire-js
  name: retire.js
  description: Scans for vulnerable JavaScript libraries (OWASP, Apache-2.0)
  entry: retire --exitwith 13 --severity medium
  language: system
  types: [javascript]
  stages: [pre-commit]
