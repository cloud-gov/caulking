# .pre-commit-config.yaml
#
# Repo-local hygiene hooks (format/lint). Global Caulking hooks already enforce:
# - forbidden-file denylist
# - gitleaks scanning (staged for pre-commit; pushed range for pre-push)

minimum_pre_commit_version: "3.6.0"
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x -S error
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: shfmt -w -i 2 -ci -sr
        language: system
        types: [shell]

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$

  - repo: meta
    hooks:
      - id: check-useless-excludes
      - id: check-hooks-apply
